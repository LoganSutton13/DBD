# Build and push app images to GitHub Container Registry (ghcr.io).
# Images: ghcr.io/<owner-lowercase>/dbd-backend, ghcr.io/<owner-lowercase>/dbd-frontend
#
# Tags:
#   - Push to main: :latest (and :main for traceability)
#   - Push tag v1.2.3: :1.2.3 and :latest
#
# After the first run, open each package on GitHub → Package settings →
# set visibility to Public if you want anonymous docker pull (no login).

name: Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Registry owner (lowercase; required by GHCR)
        run: echo "OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tag
        run: |
          B="ghcr.io/${OWNER_LC}/dbd-backend"
          F="ghcr.io/${OWNER_LC}/dbd-frontend"
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            V="${REF#refs/tags/v}"
            echo "backend_tags=${B}:${V},${B}:latest" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${F}:${V},${F}:latest" >> "$GITHUB_OUTPUT"
            echo "Pushed version ${V} and latest."
          else
            echo "backend_tags=${B}:latest,${B}:main" >> "$GITHUB_OUTPUT"
            echo "frontend_tags=${F}:latest,${F}:main" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./code/backend
          push: true
          tags: ${{ steps.tag.outputs.backend_tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./code/frontend
          file: ./code/frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.tag.outputs.frontend_tags }}
          build-args: |
            REACT_APP_API_BASE_URL=http://localhost:8001
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
