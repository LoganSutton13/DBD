# Run backend tests on push (and pull_request).
# Path generation (fields2cover) is not pip-installable and is loaded only when
# path generation runs; the app and all tests that don't run path generation work without it.
name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          # NOTE: $GITHUB_ENV expects KEY=VALUE lines; use $GITHUB_PATH for PATH updates.

      - name: Configure Poetry (no virtualenv in CI)
        run: poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short -m "not integration"
