# Same stack as docker-compose.yml, but uses pre-built images from GitHub Container
# Registry instead of building from ./code. No backend/frontend source or .env required.
#
# Defaults: ghcr.io/logansutton13/dbd-{backend,frontend}:main (overridable via env).
# Quick start: ./scripts/install-dbd-ghcr.sh
# Or: docker compose -f docker-compose.ghcr.yml pull && docker compose -f docker-compose.ghcr.yml up -d
#
# Public packages: pull works without login. Private packages: docker login ghcr.io

services:
  nodeodm:
    image: opendronemap/nodeodm:stable
    restart: unless-stopped
    ports:
      - "3000:3000"

  backend:
    image: ${DBD_IMAGE_REGISTRY:-ghcr.io/logansutton13}/dbd-backend:${DBD_VERSION:-main}
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      HOST: "0.0.0.0"
      DEBUG: "True"
      NODEODM_HOST: nodeodm
      NODEODM_PORT: "3000"
      NODEODM_URL: http://nodeodm:3000
      NODEODM_TIMEOUT: "3600"
      UPLOAD_DIR: /data/uploads
      RESULTS_DIR: /data/results
      PATH_JOBS_DIR: /data/path_jobs
    volumes:
      - dbd_app_data:/data
    depends_on:
      - nodeodm

  frontend:
    image: ${DBD_IMAGE_REGISTRY:-ghcr.io/logansutton13}/dbd-frontend:${DBD_VERSION:-main}
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - backend

volumes:
  dbd_app_data:
